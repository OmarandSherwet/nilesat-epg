name: Update Nilesat EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate guide
        run: bash scripts/update.sh
      - name: Publish validated guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/nilesat.xml docs/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Nilesat EPG'
            git push
          fi
